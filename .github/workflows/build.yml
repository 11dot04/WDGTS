name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a release on tag pushes

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Widget layouts are inflated by the launcher via RemoteViews, which only allows a few classes
      # (plain <View> is NOT one of them and shows "An error occurred when loading widget").
      - name: Check widget layouts use RemoteViews-safe classes
        run: |
          bad=$(grep -hoE '<[A-Za-z.]+' app/src/main/res/layout/widget_*.xml | sort -u \
            | grep -vE '^<(FrameLayout|LinearLayout|RelativeLayout|GridLayout|ImageView|ImageButton|TextView|Button|ProgressBar|Chronometer|TextClock|ViewFlipper|ViewStub)$' || true)
          if [ -n "$bad" ]; then echo "Not allowed in RemoteViews:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # Google Sans Flex (OFL). Skipped quietly if the download fails; a font you committed is never overwritten.
      - name: Fetch Google Sans Flex
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          if [ ! -s app/src/main/assets/fonts/display.ttf ]; then
            curl -fL --retry 3 -o /tmp/gsf.ttf \
              "https://github.com/google/fonts/raw/main/ofl/googlesansflex/GoogleSansFlex%5BGRAD%2CROND%2Copsz%2Cslnt%2Cwdth%2Cwght%5D.ttf" \
              && [ -s /tmp/gsf.ttf ] && mv /tmp/gsf.ttf app/src/main/assets/fonts/display.ttf \
              || echo "font download failed; falling back to system sans"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wdgts-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/debug/*.apk --generate-notes
